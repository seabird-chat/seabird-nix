# Activate the built configs on the seabird hosts (manual deployment event).
when:
  - event: deployment

steps:
  - name: deploy
    image: nixos/nix:2.35.1
    environment:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        accept-flake-config = true
      DEPLOY_SSH_KEY:
        from_secret: deploy_ssh_key
    commands:
      - |
        nix develop .#deploy --command bash -euo pipefail -c '
          # TODO: switch to deploy-rs --groups (node tags) once nixpkgs has a
          # groups-capable build (https://github.com/NixOS/nixpkgs/pull/547959).
          case "$CI_PIPELINE_DEPLOY_TARGET" in
            staging)    node=".#stiltzkin" ;;
            prod)       node=".#kupo" ;;
            hypervisor) node=".#eiko" ;;
            *) echo "unknown deploy target: $CI_PIPELINE_DEPLOY_TARGET" >&2; exit 1 ;;
          esac
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$DEPLOY_SSH_KEY"
          # --remote-build is also what makes this agent's architecture
          # irrelevant: it only evaluates and connects, the target builds.
          # Dropping it means the agent builds and holds every target's
          # closure, and would then have to match the target's arch.
          deploy --remote-build --skip-checks \
            --ssh-opts "-o StrictHostKeyChecking=accept-new" \
            "$node"
        '
