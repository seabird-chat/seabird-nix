# Build every seabird package and push it to the attic cache.
when:
  - event: push
    branch: main
  # Manual runs are also how other pipelines are triggered (see
  # bump-input.yml), so only claim the runs meant for this one. An unset
  # variable reads as an empty string, which keeps plain manual runs working.
  - event: manual
    evaluate: 'SEABIRD_CI_TASK == "" or SEABIRD_CI_TASK == "build"'

labels:
  platform: linux/amd64

steps:
  - name: build-and-push
    image: nixos/nix:2.35.1
    environment:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        accept-flake-config = true
        max-jobs = auto
      ATTIC_ENDPOINT: https://attic.elwert.cloud
      ATTIC_TOKEN:
        from_secret: attic_token
    commands:
      - |
        nix develop .#ci --command bash -euo pipefail -c '
          attic login elwert "$ATTIC_ENDPOINT" "$ATTIC_TOKEN"
          attic use elwert:seabird
          nix build .#all
          attic push elwert:seabird ./result
        '
